name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check brain/

      - name: Run tests
        env:
          # 测试全部走 mock（不调真实 LLM/Embedding），API Key 留空即可
          DEEPSEEK_API_KEY: ""
          SILICONFLOW_API_KEY: ""
        run: pytest tests/ -v --tb=short
